<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script2.js"></script>
    <title>Formulário</title>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Aluno</h2>
        <form id="formulario">
            <fieldset>
                <legend>Dados Pessoais </legend>
                <div class="form-group">
                    <label for="nome">Nome Completo: </label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                   <div class="form-row">
                    <label for="e-mail">E-mail: </label>
                    <input type="email" id="e-mail" name="e-mail" required placeholder="Digite seu e-mail">
                    </div>
                    <div class="form-row">
                    <label for="dataNascimento">Data de Nascimento: </label>
                    <input type="date" id="dataNascimento" name="dd/mm/aaaa" required>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Endereço: </legend>
                <div class="form-group">
                    <label for="cep">CEP: </label>
                    <input type="text" id="CEP" maxlength="9" placeholder="00000-000" required>
                    <span id="loading" class="spinner">buscando CEP...</span>
                </div>
                <div class="form-group">
                    <label for="rua">Rua/Logradouro: </label>
                    <input type="text" id="rua" name="rua" required>
                </div>
                <div class="form-row">
                <div class="form-group" style="flex: 0.3;">
                    <label for="numero">Nº </label>
                    <input type="text" id="numero" name="numero" required>
                </div>
                <div class="form-group" style="flex: 0.7;">
                    <label for="bairro">Bairro: </label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
                <div class="form-group" style="flex: 0.7;">
                    
                    <label for="cidade">Cidade: </label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
            
                <div class="form-group">
                    <label for="uf">Estado (UF): </label>
                    <input type="text" id="uf" name="uf" required>
                </div>
            </fieldset>
            <button type="submit">Cadastrar Aluno</button>
        </form>
    </div>
</body>
</html>
